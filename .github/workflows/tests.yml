name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_ai:
        description: "Also run the live AI tests (uses the ANTHROPIC_API_KEY secret, about $0.30 per run)"
        type: boolean
        default: false

jobs:
  test:
    name: Engine, data, API and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests (engine rulings, data integrity, server API)
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (phone, tablet, desktop)
        run: npx playwright test
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results/
          retention-days: 14

  live-ai:
    name: Live AI tests (billed)
    if: github.event_name == 'workflow_dispatch' && inputs.live_ai
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
